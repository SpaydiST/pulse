# Язык плагина:
#   "auto" — в игре язык определяется по локали клиента каждого игрока (поддерживается 33 языка),
#            а в веб-панели — по языку браузера (с кнопкой переключения языка в меню).
#   Или укажите конкретный код языка для всех (например: ru, en, uk, de, es, fr, pl, pt, zh_cn, ja, ko, tr).
language: "auto"

# Язык по умолчанию для консоли, Discord-отчётов и веб-панели (когда language: "auto"):
default-language: "ru"

# Как часто (в секундах) накопленная активность записывается в базу данных.
flush-interval-seconds: 60

# Сколько секунд без движения/действий игрок считается AFK.
# AFK-время не попадает в тепловую карту активности.
afk-threshold-seconds: 300

# Хранение данных: через сколько дней старые сессии удаляются автоматически.
# 0 - хранить бесконечно (по умолчанию). Очистка выполняется раз в сутки;
# вместе со старыми сессиями удаляются старые события боя и смерти (включая координаты),
# а также тепловая карта и история ников игроков без оставшихся сессий.
# Ручная очистка: /pulse purge <дней>.
data-retention-days: 0

# Боевая статистика и места смерти для админской аналитики (тихий сбор без сообщений в чат).
combat:
  enabled: true

# Снимки серверных метрик (TPS, MSPT, чанки, сущности, онлайн, память) для графиков на дашборде.
server-stats:
  enabled: true
  # Как часто снимать метрики, минут.
  interval-minutes: 1

# GeoIP: страна игрока на дашборде и в GUI по IP (флаг в карточке игрока).
# Если auto-download: true (или через /pulse geoip download), плагин сам скачает
# бесплатную базу DB-IP / GeoLite2-Country в папку плагина без лицензионного ключа.
geoip:
  enabled: true
  auto-download: true
  database-path: "plugins/Pulse/dbip-country-lite.mmdb"

# Встроенные интеграции (хуки) с LuckPerms (группа/префикс), Vault (баланс),
# LiteBans (баны/муты) и профилем Minecraft (уровень, режим игры, пинг, мир).
# Автоматически заполняют вкладку «Плагины» на веб-панели и в GUI.
hooks:
  enabled: true

# Публичный Java API (PulseApi) для отдельных Paper-плагинов-модулей.
# Внешние модули получают его через Bukkit ServicesManager после зависимости от Pulse.
api:
  enabled: true

storage:
  # sqlite - файл в папке плагина; mysql - внешний сервер БД
  # (драйвер MySQL уже встроен в Paper-совместимые серверы)
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: pulse
    username: root
    password: ""

discord:
  # Автоматические отчёты и мгновенные алерты в Discord через вебхук.
  enabled: false
  # URL вебхука: настройки канала -> интеграции -> вебхуки.
  webhook-url: ""
  # daily | weekly
  interval: daily
  # Час отправки отчёта по времени сервера (0-23).
  hour: 12
  # День недели для варианта weekly (MONDAY..SUNDAY).
  day-of-week: MONDAY
  # Мгновенные уведомления (Real-Time Alerts) в тот же вебхук:
  alerts:
    enabled: true
    # Алерт при падении TPS ниже порога:
    low-tps-threshold: 15.0
    # Алерт при заполнении памяти JVM выше %:
    high-ram-percent: 90.0
    # Алерт при новом рекорде пикового онлайна:
    peak-online: true
    # Минимальный интервал между повторными алертами (минут):
    cooldown-minutes: 15

export:
  # Автоматическая выгрузка статистики в plugins/Pulse/export/stats.json
  # (для сайта/дашборда). Ручная команда /pulse export работает всегда.
  enabled: false
  interval-minutes: 60

web:
  # Встроенный веб-дашборд (аналог Plan): открой http://<host>:<port> в браузере.
  enabled: true
  # Отображаемое имя этого сервера в панели и при связывании (пусто — берётся из MOTD / ядра).
  server-name: ""
  # На какой адрес вешать сервер. 0.0.0.0 - доступно снаружи; 127.0.0.1 - только локально.
  host: 0.0.0.0
  # Порт веб-сервера (публичный порт хостинга, напр. 25624 -> локальный 25624).
  # Внимание: у каждого сервера на одной машине должен быть СВОЙ порт (25624, 25625 и т.д.).
  port: 25624
  # Обновлять ли статистику по запросу (всегда свежие данные с БД).
  live: true
  # Показывать головы (скины) игроков в топе, списке онлайн и карточке игрока.
  heads: true
  # Источник аватарок: crafatar | mc-heads | minotar
  avatar-source: crafatar
  # Кнопки периодов активности по дням на дашборде (дней).
  activity-days: [7, 30, 90]
  # Интервал автообновления списка онлайн, секунд.
  refresh-online: 30
  # Пароль для доступа к дашборду в браузере (пусто — доступ без пароля).
  password: ""
  # Секретный токен для связывания панелей между серверами (генерируется автоматически).
  link-token: ""
  # Сколько секунд кэшировать «тяжёлые» ответы API (теплокарты, топы, активность, когорты).
  cache-ttl-seconds: 120
  # Анти-брутфорс формы входа: после N неудачных попыток по IP доступ блокируется на ban-minutes минут.
  login:
    max-attempts: 5
    ban-minutes: 10
  # История публичного Minecraft-чата хранится в БД с начала текущего запуска сервера.
  # Полная история этого запуска сохраняется при /pulse reload и перезапуске веб-панели.
  chat:
    # Максимум сообщений из панели в минуту для одной сессии/токена связки и одного IP.
    principal-rate-per-minute: 6
    ip-rate-per-minute: 20
  # Разрешить прямой доступ к веб-панели по сети (необходимо для хостингов Pterodactyl/VPS и связывания панелей).
  # Если поставить false, панель будет слушать только 127.0.0.1 (для работы за локальным Nginx/Caddy).
  insecure-remote: true

  # ═══════════════════ СВЯЗЫВАНИЕ ПАНЕЛЕЙ (МУЛЬТИ-СЕРВЕР) ═══════════════════
  # Не обязательно редактировать этот список вручную! Вы можете связать панели за 2 шага:
  #
  # СПОСОБ 1 — Прямо в браузере:
  #   Нажмите кнопку «+ Связать» в левом меню дашборда (блок «Серверы»).
  #
  # СПОСОБ 2 — Командой в игре или консоли:
  #   1) На втором сервере выполните:  /pulse link code <IP:порт_панели>
  #   2) На главном сервере выполните: /pulse link add <полученный_код>
  #   Проверка связи со всеми серверами: /pulse link test
  servers: []
  #  servers:
  #    - name: "Survival"
  #      url: "http://192.168.1.10:25625"
  #      token: "pls_..."

# Дополнительный модуль интеграции с Discord-ботом автомодерации MacronuxDAM.
# По умолчанию выключен и скрыт из основной панели.
# Включить или докачать бота отдельно можно:
#   1) В веб-панели: кнопка «🧩 Модули» в левом меню -> Включить / Скачать MacronuxDAM с GitHub
#   2) Командой: /pulse module macronuxdam <enable|disable|download>
#   3) Или поставив enabled: true ниже.
dap:
  enabled: false
  # Путь к корневой папке бота MacronuxDAM.
  # Если указанная папка не найдена, плагин автоматически выполнит поиск на VPS и сервере:
  # проверит /usr/local/bin/pmx, systemd-сервис pmx-bot.service, /opt/pmx-bot, /opt/MacronuxDAM,
  # запущенные процессы Python и соседние директории.
  bot-dir: "F:/Code/DAP"
  # Путь к SQLite базе бота (если пусто — <bot-dir>/data/modbot.db)
  db-path: ""
  # Путь к файлу телеметрии (если пусто — <bot-dir>/data/telemetry.jsonl)
  telemetry-path: ""
  # Команда запуска Python (автоматически использует .venv/bin/python на VPS при наличии)
  python-command: "python"




